<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light">
<title>Settings</title>
<link rel="icon" href="../img/mica-32.png">
<link rel="stylesheet" href="../shared/page.css">
<script src="../shared/icons.js"></script>
<script src="../shared/themes.js"></script>
<script src="../shared/page.js"></script>
<style>
  body { display: flex; min-height: 100vh; }
  nav { width: 250px; flex: none; padding: 26px 14px; position: sticky; top: 0; height: 100vh; overflow-y: auto; }
  .brand { display: flex; align-items: center; gap: 10px; padding: 0 10px 18px; font-size: 18px; font-weight: 700; letter-spacing: -.01em; }
  .brand img { width: 28px; height: 28px; }
  #find { width: 100%; margin-bottom: 14px; padding-left: 36px; }
  .find-wrap { position: relative; }
  .find-wrap .i { position: absolute; left: 11px; top: 10px; width: 17px; height: 17px; color: var(--dim); }
  nav a { display: flex; align-items: center; gap: 12px; height: 38px; padding: 0 12px; border-radius: var(--radius); color: var(--text); text-decoration: none; font-weight: 500; opacity: .85; }
  nav a:hover { background: var(--hover); opacity: 1; }
  nav a.on { background: var(--accent-soft); color: var(--accent); opacity: 1; font-weight: 600; }
  nav a .i { width: 18px; height: 18px; }
  main { flex: 1; min-width: 0; padding: 30px 40px 80px; }
  .wrap { max-width: 780px; }
  section { margin-bottom: 34px; scroll-margin-top: 20px; }
  section > h2 { font-size: 22px; letter-spacing: -.015em; margin: 0 0 4px; }
  section > p.lead { color: var(--dim); margin: 0 0 16px; }
  .card { background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 4px 20px; }
  body.glass .card { background: rgba(255,255,255,.66); backdrop-filter: blur(20px); }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 18px; padding: 15px 0; min-height: 62px; }
  .row + .row { border-top: 1px solid var(--border); }
  .row .t { font-weight: 600; }
  .row .d { color: var(--dim); font-size: 13px; margin-top: 2px; line-height: 1.45; }
  .row .ctl { flex: none; display: flex; align-items: center; gap: 8px; }
  .row.hidden-by-find { display: none; }
  .row.col { flex-direction: column; align-items: stretch; }
  .themes { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; padding: 4px 0; }
  .tcard { border: 1.5px solid var(--border); border-radius: calc(var(--radius) + 4px); padding: 8px; background: transparent; cursor: pointer; text-align: left; transition: border-color .15s, box-shadow .15s; }
  .tcard:hover { border-color: rgba(var(--accent-rgb), .5); }
  .tcard.on { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .tcard .nm { font-weight: 600; font-size: 13px; margin: 8px 2px 0; }
  .tprev { height: 82px; border-radius: 8px; overflow: hidden; position: relative; background: var(--bg); }
  .tprev .art { position: absolute; inset: 0; background: var(--art); }
  .tprev .bar { position: relative; display: flex; gap: 4px; padding: 6px 6px 0; }
  .tprev .tt { height: 9px; width: 34%; border-radius: calc(var(--radius) * .4); background: var(--hover); }
  .tprev .tt.on { background: var(--surface-2); box-shadow: 0 0 0 1px var(--border); }
  .tprev .om { position: relative; margin: 5px 6px 0; height: 10px; border-radius: 99px; background: var(--surface-2); border: 1px solid var(--border); }
  .tprev .pg { position: absolute; left: calc(var(--inset) * .5); right: calc(var(--inset) * .5); bottom: calc(var(--inset) * .5); top: 38px; border-radius: calc(var(--radius-lg) * .4); background: var(--page); box-shadow: 0 0 0 1px var(--border); }
  .tprev .pg::after { content: ""; position: absolute; left: 10px; top: 10px; width: 30%; height: 8px; border-radius: 99px; background: var(--accent); }
  .swatches { display: flex; gap: 8px; flex-wrap: wrap; }
  .swatch { width: 28px; height: 28px; border-radius: 50%; border: 0; padding: 0; position: relative; cursor: pointer; box-shadow: inset 0 0 0 1px rgba(0,0,0,.12); }
  .swatch.on::after { content: ""; position: absolute; inset: -4px; border-radius: 50%; border: 2px solid var(--accent); }
  .swatch input { opacity: 0; position: absolute; inset: 0; width: 100%; height: 100%; cursor: pointer; }
  .editor { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 16px 22px; padding: 6px 0 14px; }
  .editor label { display: flex; flex-direction: column; gap: 8px; font-weight: 600; font-size: 13px; }
  .editor input[type=range] { accent-color: var(--accent); }
  .editor input[type=color] { width: 52px; height: 32px; border: 1px solid var(--border); border-radius: 8px; padding: 2px; background: var(--surface-2); cursor: pointer; }
  .shortcut-list { display: flex; flex-direction: column; gap: 6px; }
  .sc { display: flex; gap: 8px; align-items: center; }
  .sc .input { flex: 1; height: 34px; }
  .stat-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; padding: 14px 0; }
  .stat { padding: 14px; border-radius: var(--radius); background: var(--hover); }
  .stat b { display: block; font-size: 20px; letter-spacing: -.01em; font-variant-numeric: tabular-nums; }
  .stat span { color: var(--dim); font-size: 12.5px; }
  .pill-note { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 99px; background: var(--accent-soft); color: var(--accent); font-size: 12px; font-weight: 600; }
  .restart-bar { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); display: none; align-items: center; gap: 14px; padding: 10px 10px 10px 20px; border-radius: 99px; background: var(--text); color: var(--page); box-shadow: 0 14px 40px rgba(0,0,0,.25); font-weight: 600; z-index: 10; }
  .restart-bar.on { display: flex; animation: tIn .25s var(--ease); }
  .restart-bar .btn { height: 32px; }
  kbd { display: inline-block; padding: 1px 7px; border-radius: 6px; border: 1px solid var(--border); font: 600 12px var(--font); background: var(--hover); }
  .keys { display: grid; grid-template-columns: 1fr auto; gap: 8px 20px; padding: 14px 0; }
  .keys span:nth-child(odd) { color: var(--dim); }
  @media (max-width: 760px) { nav { width: 72px; } nav a span, .brand span, .find-wrap { display: none; } main { padding: 24px; } }
</style>
</head>
<body class="light">
<nav>
  <div class="brand"><img src="../img/mica-64.png" alt=""><span>Settings</span></div>
  <div class="find-wrap"><i data-icon="search"></i><input class="input" id="find" placeholder="Search settings"></div>
  <a href="#appearance" data-s="appearance"><i data-icon="palette"></i><span>Appearance</span></a>
  <a href="#newtab" data-s="newtab"><i data-icon="grid"></i><span>New tab page</span></a>
  <a href="#search" data-s="search"><i data-icon="search"></i><span>Search</span></a>
  <a href="#performance" data-s="performance"><i data-icon="bolt"></i><span>Speed &amp; memory</span></a>
  <a href="#ai" data-s="ai"><i data-icon="sparkle"></i><span>AI helper</span></a>
  <a href="#privacy" data-s="privacy"><i data-icon="shield"></i><span>Privacy</span></a>
  <a href="#videos" data-s="videos"><i data-icon="pip"></i><span>Videos</span></a>
  <a href="#import" data-s="import"><i data-icon="import"></i><span>Import &amp; default</span></a>
  <a href="#shortcuts" data-s="shortcuts"><i data-icon="keyboard"></i><span>Keyboard shortcuts</span></a>
  <a href="#about" data-s="about"><i data-icon="info"></i><span>About &amp; updates</span></a>
</nav>
<main><div class="wrap" id="content"></div></main>
<div class="restart-bar" id="restartBar"><span>Restart Mica to finish turning Potato mode on or off</span><button class="btn primary" id="restartBtn">Restart now</button></div>

<script>
const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => [...(r || document).querySelectorAll(s)];
const esc = s => Mica.esc(s);
let startPotato = null, mem = null;

const sw = (key, on) => '<label class="switch"><input type="checkbox" data-key="' + key + '"' + (on ? ' checked' : '') + '><span></span></label>';
const row = (t, d, ctl, extra) => '<div class="row ' + (extra || '') + '" data-find="' + esc((t + ' ' + (d || '')).toLowerCase()) + '"><div><div class="t">' + t + '</div>' + (d ? '<div class="d">' + d + '</div>' : '') + '</div><div class="ctl">' + ctl + '</div></div>';
const seg = (key, cur, opts) => '<div class="segmented" data-seg="' + key + '">' + opts.map(o => '<button data-v="' + esc(JSON.stringify(o[0])) + '" class="' + (JSON.stringify(cur) === JSON.stringify(o[0]) ? 'on' : '') + '">' + o[1] + '</button>').join('') + '</div>';

function render() {
  const s = Mica.settings, sys = Mica.sys;
  if (startPotato === null) startPotato = !!s.potato;
  const T = MicaThemes.THEMES;
  const rec = sys.recommendSleep || 5;
  const sleepOpts = [[1, '1 min'], [3, '3 min'], [5, '5 min'], [15, '15 min'], [30, '30 min'], [0, 'Never']].map(o => [o[0], o[1] + (o[0] === rec ? '<span class="rec">★</span>' : '')]);
  const cu = MicaThemes.resolve(s);
  const solid = v => /^#[0-9a-f]{6}$/i.test(v || '') ? v : (cu.dark ? '#1b1d24' : '#ffffff');

  $('#content').innerHTML =
  // ---------------- appearance
  '<section id="appearance"><h2>Appearance</h2><p class="lead">Make Mica look exactly how you like.</p>' +
  '<div class="card"><div class="row col" data-find="theme look style glass dark light retro windows midnight glow"><div class="t" style="margin-bottom:12px">Theme</div><div class="themes">' +
  Object.keys(T).map(k => '<button class="tcard' + (s.theme === k ? ' on' : '') + '" data-theme="' + k + '"><div class="tprev" data-prev="' + k + '"><div class="art"></div><div class="bar"><span class="tt on"></span><span class="tt"></span></div><div class="om"></div><div class="pg"></div></div><div class="nm">' + T[k].name + '</div></button>').join('') +
  '<button class="tcard' + (s.theme === 'custom' ? ' on' : '') + '" data-theme="custom"><div class="tprev" data-prev="custom"><div class="art"></div><div class="bar"><span class="tt on"></span><span class="tt"></span></div><div class="om"></div><div class="pg"></div></div><div class="nm">Custom</div></button>' +
  '</div></div>' +
  '<div class="row col" data-find="accent color colour"><div class="t" style="margin-bottom:12px">Accent color</div><div class="swatches">' +
  MicaThemes.ACCENTS.map(a => '<button class="swatch' + (s.accent === a ? ' on' : '') + '" data-accent="' + a + '" style="background:' + a + '"></button>').join('') +
  '<label class="swatch' + (MicaThemes.ACCENTS.includes(s.accent) ? '' : ' on') + '" title="Any color" style="background:conic-gradient(red,yellow,lime,cyan,blue,magenta,red)"><input type="color" id="accentPick" value="' + solid(s.accent) + '"></label></div></div>' +
  '<div class="row col" data-find="custom theme editor background text roundness corners blur glass"><div><div class="t">Make your own theme</div><div class="d">Changing anything here switches you to your Custom theme.</div></div><div class="editor">' +
  '<label>Start from<select class="input" data-ck="base">' + Object.keys(T).map(k => '<option value="' + k + '"' + ((s.custom && s.custom.base || 'clean') === k ? ' selected' : '') + '>' + T[k].name + '</option>').join('') + '</select></label>' +
  '<label>Background<input type="color" data-ck="bg" value="' + solid(cu.bg) + '"></label>' +
  '<label>Bars, tabs and menus<input type="color" data-ck="surface2" value="' + solid(cu.surface2) + '"></label>' +
  '<label>Text<input type="color" data-ck="text" value="' + solid(cu.text) + '"></label>' +
  '<label>Roundness: ' + (cu.radius | 0) + 'px<input type="range" min="0" max="20" data-ck="radius" value="' + (cu.radius | 0) + '"></label>' +
  '<label>Space around pages: ' + (cu.inset | 0) + 'px<input type="range" min="0" max="16" data-ck="inset" value="' + (cu.inset | 0) + '"></label>' +
  '<label>Glass blur: ' + (cu.blur | 0) + 'px<input type="range" min="0" max="40" data-ck="blur" value="' + (cu.blur | 0) + '"></label>' +
  '<label>Font<select class="input" data-ck="font">' + [['', 'Segoe UI (default)'], ['"Segoe UI Variable Display","Segoe UI",sans-serif', 'Segoe UI Variable'], ['Bahnschrift,sans-serif', 'Bahnschrift'], ['Georgia,serif', 'Georgia'], ['"Cascadia Mono",Consolas,monospace', 'Monospace'], ['"Comic Sans MS",cursive', 'Comic Sans']].map(f => '<option value="' + esc(f[0]) + '"' + ((cu.font || '') === f[0] ? ' selected' : '') + '>' + f[1] + '</option>').join('') + '</select></label>' +
  '</div></div>' +
  row('Tab position', 'Tabs across the top, or a list down the side.', seg('tabs', s.tabs || 'top', [['top', 'Top'], ['side', 'Side']])) +
  row('Show bookmarks bar', 'A row of your bookmarks under the address bar.', sw('bookmarksBar', s.bookmarksBar)) +
  row('Show memory meter', 'Shows how much memory Mica is using, next to the menu button.', sw('showMemory', s.showMemory)) +
  row('Animations', 'Smooth motion in menus and the tour. Turn off for a snappier feel on slow PCs.', sw('animations', s.animations !== false)) +
  '</div></section>' +

  // ---------------- new tab
  '<section id="newtab"><h2>New tab page</h2><p class="lead">What you see when you open a new tab.</p><div class="card">' +
  row('Wallpaper', s.wallpaper ? 'Using your picture' : 'Using the theme background', (s.wallpaper ? '<button class="btn sm ghost" data-act="wallRemove">Remove</button>' : '') + '<button class="btn sm" data-act="wallPick">' + icon('image') + 'Choose picture</button>') +
  row('Show clock', '', sw('showClock', s.showClock !== false)) +
  row('24-hour clock', '', sw('clock24', s.clock24)) +
  row('Show weather', s.weather ? 'For ' + esc(s.weather.name) + '. Change the city from the new tab page.' : 'Set your city from the new tab page (click the weather).', sw('showWeather', s.showWeather !== false)) +
  row('Temperature', '', seg('tempUnit', s.tempUnit || 'F', [['F', '°F'], ['C', '°C']])) +
  '<div class="row col" data-find="shortcuts tiles favorite sites"><div class="t" style="margin-bottom:10px">Shortcuts</div><div class="shortcut-list">' +
  (s.shortcuts || []).map((x, i) => '<div class="sc"><input class="input" data-sc="' + i + '" data-f="title" value="' + esc(x.title) + '" style="flex:.6"><input class="input" data-sc="' + i + '" data-f="url" value="' + esc(x.url) + '"><button class="icon-btn" data-scrm="' + i + '" title="Remove">' + icon('trash') + '</button></div>').join('') +
  '<div><button class="btn sm" data-act="scAdd">' + icon('plus') + 'Add shortcut</button></div></div></div>' +
  '</div></section>' +

  // ---------------- search
  '<section id="search"><h2>Search</h2><p class="lead">Used when you type something that isn\'t a web address.</p><div class="card">' +
  row('Search engine', '', seg('search', s.search || 'google', [['google', 'Google'], ['duckduckgo', 'DuckDuckGo'], ['bing', 'Bing'], ['brave', 'Brave']])) +
  '</div></section>' +

  // ---------------- performance
  '<section id="performance"><h2>Speed &amp; memory</h2><p class="lead">Mica is built for older PCs. These settings keep it light.</p><div class="card">' +
  '<div class="stat-grid" data-find="memory ram pc specs"><div class="stat"><b id="memNow">' + (mem ? mem.mb + ' MB' : '…') + '</b><span>Mica is using</span></div><div class="stat"><b>' + (sys.ramGB || '?') + ' GB</b><span>Memory in this PC</span></div><div class="stat"><b>' + (sys.cores || '?') + '</b><span>Processor cores</span></div><div class="stat"><b id="tabsNow">' + (mem ? mem.awake + ' / ' + mem.asleep : '…') + '</b><span>Tabs awake / asleep</span></div></div>' +
  row('Put unused tabs to sleep after', 'Sleeping tabs use no memory. They reload when you click them. ★ = recommended for your PC.', seg('sleepMinutes', s.sleepMinutes == null ? 5 : s.sleepMinutes, sleepOpts), 'col') +
  row('Potato mode', (sys.slow ? '<span class="pill-note">' + icon('bolt') + 'Recommended for this PC</span> ' : '') + 'Uses Chromium\'s low-memory mode, fewer background processes, and turns off blur and animations. Needs a restart.', sw('potato', s.potato)) +
  row('Restore tabs when Mica opens', 'Your tabs come back asleep, so they don\'t use memory until you click them.', sw('restoreSession', s.restoreSession !== false)) +
  '</div></section>' +

  // ---------------- ai
  '<section id="ai"><h2>AI helper</h2><p class="lead">Free, with no account. Opens in a side panel. When it\'s off, it uses no memory at all.</p><div class="card">' +
  row('Turn on the AI helper', 'Adds the ✦ button, <kbd>Ctrl+Shift+A</kbd>, and "Ask Mica AI" when you right-click selected text.', sw('aiEnabled', s.aiEnabled)) +
  row('Which AI', 'Duck.ai is run by DuckDuckGo and lets you pick models like Claude, GPT-4o mini and Llama. ChatGPT is run by OpenAI.', seg('aiProvider', s.aiProvider || 'duck', [['duck', 'Duck.ai'], ['chatgpt', 'ChatGPT']])) +
  '</div></section>' +

  // ---------------- privacy
  '<section id="privacy"><h2>Privacy</h2><p class="lead">Mica has no account, no ads and no tracking of its own.</p><div class="card">' +
  row('Tracking prevention', 'Blocks trackers that follow you across websites. Strict may break a few sites.', seg('tracking', s.tracking || 'balanced', [['basic', 'Basic'], ['balanced', 'Balanced'], ['strict', 'Strict']])) +
  row('Clear history', 'Removes the list of pages you\'ve visited.', '<button class="btn sm" data-clear="history">' + icon('history') + 'Clear</button>') +
  row('Clear cookies and site data', 'Signs you out of most websites.', '<button class="btn sm" data-clear="cookies">Clear</button>') +
  row('Clear cached images and files', 'Frees disk space. Sites may load a little slower the first time.', '<button class="btn sm" data-clear="cache">Clear</button>') +
  row('Clear everything', 'History, cookies, cache, saved passwords and form data.', '<button class="btn sm danger" data-clear="all">' + icon('trash') + 'Clear all</button>') +
  row('Private window', 'Browse without saving anything. Press <kbd>Ctrl+Shift+N</kbd>.', '') +
  '</div></section>' +

  // ---------------- videos
  '<section id="videos"><h2>Videos</h2><div class="card">' +
  row('Picture-in-picture button', 'Shows a small "Pop out" button at the top of videos when you hover over them, so the video can float over other windows.', sw('pipButton', s.pipButton !== false)) +
  '</div></section>' +

  // ---------------- import
  '<section id="import"><h2>Import &amp; default browser</h2><div class="card">' +
  row('Import bookmarks from Chrome', sys.hasChrome ? 'Copies your Chrome bookmarks into Mica.' : 'Chrome wasn\'t found on this PC.', '<button class="btn sm" data-import="chrome"' + (sys.hasChrome ? '' : ' disabled') + '>' + icon('import') + 'Import</button>') +
  row('Import bookmarks from Edge', sys.hasEdge ? 'Copies your Edge bookmarks into Mica.' : 'Edge wasn\'t found on this PC.', '<button class="btn sm" data-import="edge"' + (sys.hasEdge ? '' : ' disabled') + '>' + icon('import') + 'Import</button>') +
  row('Default browser', 'Make links from other apps open in Mica.', '<button class="btn sm" data-act="setDefault">Make default</button>') +
  '</div></section>' +

  // ---------------- keyboard
  '<section id="shortcuts"><h2>Keyboard shortcuts</h2><div class="card"><div class="keys" data-find="keyboard shortcuts keys hotkeys">' +
  [['New tab', 'Ctrl+T'], ['Close tab', 'Ctrl+W'], ['Reopen closed tab', 'Ctrl+Shift+T'], ['Next / previous tab', 'Ctrl+Tab / Ctrl+Shift+Tab'], ['Go to tab 1–8, last tab', 'Ctrl+1…8, Ctrl+9'], ['Private window', 'Ctrl+Shift+N'], ['Address bar', 'Ctrl+L'], ['Bookmark page', 'Ctrl+D'], ['History', 'Ctrl+H'], ['Bookmarks', 'Ctrl+Shift+O'], ['Downloads', 'Ctrl+J'], ['AI helper', 'Ctrl+Shift+A'], ['Screenshot', 'Ctrl+Shift+S'], ['Find on page', 'Ctrl+F'], ['Full screen', 'F11'], ['Inspect (developer tools)', 'F12 or Ctrl+Shift+I'], ['Settings', 'Ctrl+,']]
    .map(k => '<span>' + k[0] + '</span><span>' + k[1].split(' ').map(p => /[A-Za-z0-9+,…]/.test(p) && p !== 'or' && p !== '/' ? '<kbd>' + p + '</kbd>' : ' ' + p + ' ').join('') + '</span>').join('') +
  '</div></div></section>' +

  // ---------------- about
  '<section id="about"><h2>About &amp; updates</h2><div class="card">' +
  row('Mica ' + esc(sys.version || ''), 'Chromium engine ' + esc((sys.engine || '').split(' ')[0]) + ' · ' + (sys.is64 ? '64-bit' : '32-bit') + ' · Free and open source (MIT)', '<button class="btn sm" data-act="github">' + icon('external') + 'GitHub</button>') +
  row('Check for updates automatically', 'Mica always asks before installing anything.', sw('updateCheck', s.updateCheck !== false)) +
  row('Check now', '<span id="updStatus"></span>', '<button class="btn sm" data-act="checkUpdate">' + icon('update') + 'Check</button>') +
  row('Welcome tour', 'See the setup and tour again.', '<button class="btn sm" data-act="tour">' + icon('compass') + 'Start tour</button>') +
  row('Mica\'s data folder', 'Settings, bookmarks and history are stored here.', '<button class="btn sm" data-act="dataFolder">' + icon('folder') + 'Open</button>') +
  '</div></section>';

  hydrateIcons($('#content'));
  $$('[data-prev]').forEach(p => {
    const k = p.dataset.prev;
    MicaThemes.apply(k === 'custom' ? Object.assign({}, s, { theme: 'custom', custom: s.custom || { base: 'clean' } }) : { theme: k, accent: T[k].accent }, { el: p });
  });
  wire();
  applyFind();
  $('#restartBar').classList.toggle('on', !!s.potato !== startPotato);
  requestAnimationFrame(spy);
}

function wire() {
  const s = Mica.settings;
  $$('[data-key]').forEach(i => i.addEventListener('change', () => Mica.set(i.dataset.key, i.checked)));
  $$('[data-seg]').forEach(g => g.addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    Mica.set(g.dataset.seg, JSON.parse(b.dataset.v));
    render();
  }));
  $$('[data-theme]').forEach(b => b.addEventListener('click', () => {
    const k = b.dataset.theme;
    if (k === 'custom' && !s.custom) Mica.set('custom', { base: MicaThemes.THEMES[s.theme] ? s.theme : 'clean' });
    Mica.set('theme', k);
    if (k !== 'custom') Mica.set('accent', MicaThemes.THEMES[k].accent);
    render();
  }));
  $$('[data-accent]').forEach(b => b.addEventListener('click', () => { Mica.set('accent', b.dataset.accent); render(); }));
  $('#accentPick').addEventListener('change', e => { Mica.set('accent', e.target.value); render(); });
  $$('[data-ck]').forEach(inp => inp.addEventListener('change', () => {
    const k = inp.dataset.ck;
    const base = MicaThemes.resolve(Mica.settings);
    let next = Object.assign({ base: 'clean' }, Mica.settings.custom || {});
    if (k === 'base') next = { base: inp.value };
    else next[k] = inp.type === 'range' ? +inp.value : inp.value;
    if (k === 'text') next.dim = inp.value + 'b0';
    if (k === 'bg') { next.art = 'none'; next.surface = inp.value; next.page = inp.value; }
    if (k === 'blur') next.glass = +inp.value > 0;
    if (k === 'bg' || k === 'base') next.dark = MicaThemes.hexToRgb(next.bg || MicaThemes.THEMES[next.base].bg).reduce((a, b) => a + b, 0) < 384;
    Mica.set('custom', next);
    Mica.set('theme', 'custom');
    render();
  }));
  $$('[data-sc]').forEach(inp => inp.addEventListener('change', () => {
    const list = (Mica.settings.shortcuts || []).map(x => Object.assign({}, x));
    let v = inp.value.trim();
    if (inp.dataset.f === 'url' && v && !/^https?:\/\//i.test(v)) v = 'https://' + v;
    list[+inp.dataset.sc][inp.dataset.f] = v;
    Mica.set('shortcuts', list);
  }));
  $$('[data-scrm]').forEach(b => b.addEventListener('click', () => {
    const list = (Mica.settings.shortcuts || []).slice(); list.splice(+b.dataset.scrm, 1); Mica.set('shortcuts', list); render();
  }));
  $$('[data-clear]').forEach(b => b.addEventListener('click', () => {
    const what = b.dataset.clear;
    if (what === 'all' && !confirm('Clear all browsing data? This signs you out of websites and can\'t be undone.')) return;
    b.disabled = true;
    Mica.send({ cmd: 'clearData', what });
  }));
  $$('[data-import]').forEach(b => b.addEventListener('click', () => { b.disabled = true; Mica.send({ cmd: 'import', from: b.dataset.import }); }));
  $$('[data-act]').forEach(b => b.addEventListener('click', () => {
    switch (b.dataset.act) {
      case 'wallPick': Mica.send({ cmd: 'pickWallpaper' }); break;
      case 'wallRemove': Mica.set('wallpaper', ''); render(); break;
      case 'scAdd': Mica.set('shortcuts', (Mica.settings.shortcuts || []).concat([{ title: 'New', url: 'https://' }])); render(); break;
      case 'setDefault': Mica.send({ cmd: 'setDefault' }); break;
      case 'github': Mica.send({ cmd: 'openUrl', url: Mica.sys.repo }); break;
      case 'checkUpdate': $('#updStatus').textContent = 'Checking…'; Mica.send({ cmd: 'checkUpdate' }); break;
      case 'tour': Mica.send({ cmd: 'startTour' }); break;
      case 'dataFolder': Mica.send({ cmd: 'openFolder', which: 'data' }); break;
    }
  }));
}

// search box filters rows
$('#find').addEventListener('input', applyFind);
function applyFind() {
  const q = $('#find').value.trim().toLowerCase();
  $$('section').forEach(sec => {
    let any = false;
    $$('.row, .keys', sec).forEach(r => {
      const hit = !q || (r.dataset.find || r.textContent.toLowerCase()).includes(q) || sec.querySelector('h2').textContent.toLowerCase().includes(q);
      r.classList.toggle('hidden-by-find', !hit);
      if (hit) any = true;
    });
    sec.style.display = any ? '' : 'none';
  });
}

// highlight the section in view
function spy() {
  let cur = 'appearance';
  $$('section').forEach(s => { if (s.offsetParent && s.getBoundingClientRect().top < 140) cur = s.id; });
  $$('nav a').forEach(a => a.classList.toggle('on', a.dataset.s === cur));
}
document.addEventListener('scroll', spy, { passive: true });

$('#restartBtn').addEventListener('click', () => Mica.send({ cmd: 'restart' }));

Mica.on('init', () => {
  render();
  Mica.send({ cmd: 'memory' });
  if (location.hash) setTimeout(() => { const el = document.getElementById(location.hash.slice(1)); if (el) el.scrollIntoView(); spy(); }, 50);
  spy();
});
Mica.on('settings', () => { const y = scrollY; render(); scrollTo(0, y); });
Mica.on('memory', m => {
  mem = m;
  const a = $('#memNow'), b = $('#tabsNow');
  if (a) a.textContent = m.mb + ' MB';
  if (b) b.textContent = m.awake + ' / ' + m.asleep;
});
Mica.on('imported', m => {
  Mica.toast(m.count > 0 ? 'Imported ' + m.count + ' bookmarks' : m.count === 0 ? 'Nothing new to import' : 'Couldn\'t find bookmarks to import');
  $$('[data-import]').forEach(b => b.disabled = false);
});
Mica.on('cleared', m => { Mica.toast('Cleared'); $$('[data-clear]').forEach(b => b.disabled = false); });
Mica.on('updateResult', m => {
  $('#updStatus').textContent = m.error ? 'Couldn\'t check: ' + m.error : m.version ? 'Version ' + m.version + ' is available. Click the update button in the toolbar.' : 'You\'re up to date (' + m.current + ').';
});
window.addEventListener('hashchange', () => { const el = document.getElementById(location.hash.slice(1)); if (el) el.scrollIntoView({ behavior: 'smooth' }); });
</script>
</body>
