<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light">
<title>Downloads</title>
<link rel="icon" href="../img/mica-32.png">
<link rel="stylesheet" href="../shared/page.css">
<script src="../shared/icons.js"></script>
<script src="../shared/themes.js"></script>
<script src="../shared/page.js"></script>
<script src="../shared/downloads.js"></script>
<style>
  main { max-width: 860px; margin: 0 auto; padding: 34px 28px 80px; }
  header { display: flex; align-items: center; gap: 12px; margin-bottom: 22px; flex-wrap: wrap; }
  header h1 { margin: 0; font-size: 26px; letter-spacing: -.02em; flex: 1; }
  .search { position: relative; width: 260px; }
  .search .i { position: absolute; left: 11px; top: 10px; width: 17px; height: 17px; color: var(--dim); }
  .search .input { width: 100%; padding-left: 36px; }
  .day { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--dim); margin: 22px 4px 8px; }
  .list { background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 6px; }
  body.glass .list { background: var(--glass-bg); backdrop-filter: blur(var(--blur)); }
  .row { display: flex; align-items: center; gap: 14px; padding: 10px 10px 10px 12px; border-radius: var(--radius); animation: rowIn .35s var(--ease, ease) both; }
  @keyframes rowIn { from { opacity: 0; transform: translateY(6px); } }
  .row:hover { background: var(--hover); }
  .txt { flex: 1; min-width: 0; }
  .name { font-weight: 600; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .name a { color: inherit; text-decoration: none; cursor: pointer; }
  .name a:hover { color: var(--accent); text-decoration: underline; }
  .row.s-canceled .name, .row.s-failed .name, .row.gone .name { color: var(--dim); text-decoration: line-through; text-decoration-color: rgba(127,127,127,.5); }
  .url { color: var(--dim); font-size: 12px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; margin-top: 1px; }
  .sub { color: var(--dim); font-size: 12.5px; margin-top: 3px; font-variant-numeric: tabular-nums; }
  .row.s-failed .sub { color: #e5484d; }
  .bar { height: 5px; border-radius: 99px; background: var(--accent-soft); margin-top: 7px; overflow: hidden; max-width: 420px; }
  .bar span { display: block; height: 100%; border-radius: 99px; background: var(--accent); transition: width .3s linear; }
  .row.s-paused .bar span { background: var(--dim); }
  .bar.ind span { width: 30% !important; animation: ind 1.2s ease-in-out infinite; }
  @keyframes ind { from { transform: translateX(-100%); } to { transform: translateX(340%); } }
  .acts { display: flex; gap: 4px; flex: none; }
  .dl-act { width: 34px; height: 34px; display: grid; place-items: center; border-radius: 9px; color: var(--dim); background: none; border: 0; cursor: pointer; }
  .dl-act:hover { background: var(--hover); color: var(--text); }
  .dl-act .i { width: 17px; height: 17px; }
  .dl-file { position: relative; flex: none; width: 38px; height: 46px; border-radius: 7px 14px 7px 7px; background: color-mix(in srgb, var(--c) 14%, transparent); border: 1.5px solid color-mix(in srgb, var(--c) 45%, transparent); display: grid; place-items: end center; padding-bottom: 6px; }
  .dl-file span { font-size: 9.5px; font-weight: 800; letter-spacing: .03em; color: var(--c); }
  .dl-file .dl-ok { position: absolute; right: -5px; bottom: -4px; width: 16px; height: 16px; border-radius: 50%; background: #22c55e; box-shadow: 0 0 0 2px var(--surface-2, #fff); }
  .dl-file .dl-ok::after { content: ""; position: absolute; left: 5px; top: 3.2px; width: 3.8px; height: 7px; border: solid #fff; border-width: 0 1.8px 1.8px 0; transform: rotate(45deg); }
  .empty { text-align: center; color: var(--dim); padding: 70px 20px; }
  .empty .i { width: 44px; height: 44px; margin-bottom: 10px; opacity: .6; }
  @media print { .acts, header .btn, .search { display: none !important; } }
</style>
</head>
<body class="light">
<main>
  <header>
    <h1>Downloads</h1>
    <div class="search"><i data-icon="search"></i><input class="input" id="q" placeholder="Search downloads"></div>
    <button class="btn sm" id="folder"><i data-icon="folder"></i>Open folder</button>
    <button class="btn sm danger" id="clearAll">Clear all</button>
  </header>
  <div id="out"></div>
</main>
<script>
const $ = s => document.querySelector(s);
const esc = s => Mica.esc(s);
let list = [], drawnKey = '';

function dayLabel(t) {
  const d = new Date(t), today = new Date(); today.setHours(0, 0, 0, 0);
  const diff = Math.round((today - new Date(d).setHours(0, 0, 0, 0)) / 864e5);
  if (diff === 0) return 'Today';
  if (diff === 1) return 'Yesterday';
  return d.toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric' });
}
function row(d) {
  const moving = d.state === 'progress' || d.state === 'paused';
  const openable = d.state === 'done' && d.exists !== false;
  return '<div class="row s-' + d.state + (d.state === 'done' && d.exists === false ? ' gone' : '') + '" data-id="' + d.id + '">' + MicaDl.badge(d) +
    '<div class="txt"><div class="name">' + (openable ? '<a data-a="dlOpen" title="Open">' + esc(d.name) + '</a>' : esc(d.name)) + '</div>' +
    '<div class="url">' + esc(d.url || '') + '</div>' +
    '<div class="sub">' + esc(MicaDl.status(d)) + '</div>' +
    (moving ? '<div class="bar' + (d.total > 0 ? '' : ' ind') + '"><span style="width:' + MicaDl.pct(d).toFixed(1) + '%"></span></div>' : '') + '</div>' +
    '<div class="acts">' + MicaDl.actions(d) + (d.state === 'done' ? '<button class="dl-act" data-a="dlRemove" title="Remove from list">' + icon('x') + '</button>' : '') + '</div></div>';
}
function render() {
  const q = $('#q').value.trim().toLowerCase();
  const shown = list.filter(d => !q || (d.name + ' ' + (d.url || '')).toLowerCase().includes(q));
  const key = q + '|' + shown.map(d => d.id + d.state + (d.exists === false)).join(',');
  $('#clearAll').style.display = list.some(d => d.state !== 'progress' && d.state !== 'paused') ? '' : 'none';
  if (key === drawnKey) {
    // just progress numbers changed: update them in place
    shown.forEach(d => {
      const r = document.querySelector('.row[data-id="' + d.id + '"]');
      if (!r) return;
      r.querySelector('.sub').textContent = MicaDl.status(d);
      const b = r.querySelector('.bar span');
      if (b) b.style.width = MicaDl.pct(d).toFixed(1) + '%';
    });
    return;
  }
  drawnKey = key;
  if (!shown.length) {
    $('#out').innerHTML = '<div class="empty">' + icon('download') + '<div>' + (q ? 'No downloads match.' : 'Files you download will show up here.') + '</div></div>';
    return;
  }
  let html = '', cur = '';
  shown.forEach(d => {
    const day = dayLabel(d.t);
    if (day !== cur) { html += (cur ? '</div>' : '') + '<div class="day">' + day + '</div><div class="list">'; cur = day; }
    html += row(d);
  });
  $('#out').innerHTML = html + '</div>';
}
$('#out').addEventListener('click', e => {
  const a = e.target.closest('[data-a]');
  if (!a) return;
  const r = a.closest('.row');
  Mica.send({ cmd: a.dataset.a, id: r ? +r.dataset.id : 0 });
});
$('#q').addEventListener('input', render);
$('#folder').addEventListener('click', () => Mica.send({ cmd: 'dlFolder' }));
$('#clearAll').addEventListener('click', () => Mica.send({ cmd: 'dlClear' }));
Mica.on('downloads', m => { list = m.list || []; render(); });
Mica.on('init', () => Mica.send({ cmd: 'dlList' }));
</script>
</body>
</html>
